<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="https://avatars.githubusercontent.com/u/1412262?v=4">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- CMS -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>

  <!-- Floating Frosted Glass Navbar -->
  <nav class="navbar-wrapper">
    <div class="navbar-container">
      <a href="{{ "/" | relative_url }}" class="navbar-brand">
        <img src="https://avatars.githubusercontent.com/u/1412262?v=4" alt="{{ site.title }}" class="navbar-avatar">
        <div class="navbar-brand-text">
          <span class="navbar-name">{{ site.title }}</span>
          <span class="navbar-badge">Associate Architect</span>
        </div>
      </a>

      <div class="navbar-links">
        <a href="{{ "/" | relative_url }}" class="nav-link">Home</a>
        <a href="{{ "/android" | relative_url }}" class="nav-link">Android</a>
        <a href="{{ "/blog" | relative_url }}" class="nav-link">Blog</a>
        <a href="https://github.com/hissain" target="_blank" rel="noopener" class="nav-link">GitHub</a>
        <a href="https://www.linkedin.com/in/hissain/" target="_blank" rel="noopener" class="nav-link">LinkedIn</a>
      </div>

      <div class="navbar-actions">
        <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle Theme">
          <span id="themeIcon">☀️</span>
        </button>
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation menu" aria-expanded="false" onclick="toggleMobileMenu()">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="container">
    {{ content }}
  </div>

  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-brand">
        <img src="https://avatars.githubusercontent.com/u/1412262?v=4" alt="{{ site.title }}" class="navbar-avatar" style="width: 36px; height: 36px;">
        <div>
          <span class="footer-brand-title">{{ site.title }}</span>
          <span class="footer-brand-subtitle">&copy; <span id="year"></span> {{ site.title }} &bull; Associate Software Architect</span>
        </div>
      </div>

      <div class="footer-links-grid">
        <a href="{{ "/" | relative_url }}" class="footer-link">Home</a>
        <a href="{{ "/android" | relative_url }}" class="footer-link">Android</a>
        <a href="{{ "/blog" | relative_url }}" class="footer-link">Blog</a>
        <a href="https://github.com/hissain" target="_blank" rel="noopener" class="footer-link">GitHub</a>
        <a href="https://www.linkedin.com/in/hissain/" target="_blank" rel="noopener" class="footer-link footer-link-highlight">LinkedIn &#8599;</a>
        <a href="https://infomity.github.io/" target="_blank" rel="noopener" class="footer-link footer-link-highlight">Infomity Studio &#8599;</a>
      </div>
    </div>
  </footer>

  <script>
    function toggleMobileMenu() {
      const container = document.querySelector('.navbar-container');
      const btn = document.getElementById('mobileMenuBtn');
      if (!container) return;
      const isOpen = container.classList.toggle('is-open');
      if (btn) btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }

    document.addEventListener('click', function(e) {
      const container = document.querySelector('.navbar-container');
      if (!container || !container.classList.contains('is-open')) return;
      if (!container.contains(e.target)) {
        container.classList.remove('is-open');
        const btn = document.getElementById('mobileMenuBtn');
        if (btn) btn.setAttribute('aria-expanded', 'false');
      }
    });

    document.querySelectorAll('.navbar-links .nav-link').forEach(link => {
      link.addEventListener('click', () => {
        const container = document.querySelector('.navbar-container');
        if (container && container.classList.contains('is-open')) {
          container.classList.remove('is-open');
          const btn = document.getElementById('mobileMenuBtn');
          if (btn) btn.setAttribute('aria-expanded', 'false');
        }
      });
    });

    document.getElementById('year').textContent = new Date().getFullYear();

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    // Check for saved theme preference; default to dark obsidian for engineering aesthetic
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      html.setAttribute('data-theme', 'light');
      if (themeIcon) themeIcon.textContent = '🌙';
    } else {
      html.removeAttribute('data-theme');
      if (themeIcon) themeIcon.textContent = '☀️';
    }

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        if (html.getAttribute('data-theme') === 'light') {
          html.removeAttribute('data-theme');
          localStorage.setItem('theme', 'dark');
          if (themeIcon) themeIcon.textContent = '☀️';
        } else {
          html.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
          if (themeIcon) themeIcon.textContent = '🌙';
        }
      });
    }
  </script>
</body>

</html>
