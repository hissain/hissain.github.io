<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="https://avatars.githubusercontent.com/u/1412262?v=4">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- CMS -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>

<body>

  <!-- Floating Frosted Glass Navbar -->
  <nav class="navbar-wrapper">
    <div class="navbar-container">
      <a href="{{ "/" | relative_url }}" class="navbar-brand">
        <img src="https://avatars.githubusercontent.com/u/1412262?v=4" alt="{{ site.title }}" class="navbar-avatar">
        <div class="navbar-brand-text">
          <span class="navbar-name">{{ site.title }}</span>
          <span class="navbar-badge">Associate Architect</span>
        </div>
      </a>

      <div class="navbar-links">
        <a href="{{ "/" | relative_url }}" class="nav-link">Home</a>
        <a href="{{ "/android" | relative_url }}" class="nav-link">Android</a>
        <a href="{{ "/blog" | relative_url }}" class="nav-link">Blog</a>
        <a href="https://github.com/hissain" target="_blank" rel="noopener" class="nav-link">GitHub</a>
        <a href="https://www.linkedin.com/in/hissain/" target="_blank" rel="noopener" class="nav-link">LinkedIn</a>
      </div>

      <div class="navbar-actions">
        <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle Theme">
          <span id="themeIcon">☀️</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="container">
    {{ content }}
  </div>

  <footer>
    <p>&copy; <span id="year"></span> {{ site.title }}. Engineered with modern web standards.</p>
    <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.6; font-family: var(--font-mono);">v{{ site.version }} &bull; Distributed via GitHub Pages</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const html = document.documentElement;

    // Check for saved theme preference; default to dark obsidian for engineering aesthetic
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      html.setAttribute('data-theme', 'light');
      if (themeIcon) themeIcon.textContent = '🌙';
    } else {
      html.removeAttribute('data-theme');
      if (themeIcon) themeIcon.textContent = '☀️';
    }

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        if (html.getAttribute('data-theme') === 'light') {
          html.removeAttribute('data-theme');
          localStorage.setItem('theme', 'dark');
          if (themeIcon) themeIcon.textContent = '☀️';
        } else {
          html.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
          if (themeIcon) themeIcon.textContent = '🌙';
        }
      });
    }
  </script>
</body>

</html>
